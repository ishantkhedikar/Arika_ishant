<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arika Collabs | Admin Login</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>

<!-- Reuses the same auth-page split layout as login.html, no tabs (admins don't self-register) -->
<body class="auth-page">

  <div class="auth-split">

    <!-- ============ LEFT PANEL: FORM ============ -->
    <div class="auth-panel">
      <a href="index.html" class="logo">ARIKA <span>COLLABS</span></a>

      <div class="auth-card">
        <form class="auth-form active" id="admin-login-form">
          <h2>Admin Login</h2>
          <p class="auth-subtitle">Secure access for authorized personnel only.</p>

          <label for="admin-email">Email address</label>
          <input type="email" id="admin-email" placeholder="you@arikacollabs.com" required>

          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" placeholder="••••••••" required>

          <div class="auth-row">
            <label class="checkbox-label">
              <input type="checkbox" id="admin-remember-me" style="width:auto;">
              Remember me
            </label>
            <a href="forgot-password.html" class="link-muted">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-gold btn-full">Sign In &rarr;</button>
        </form>
      </div>
    </div>

    <!-- ============ RIGHT PANEL: IMAGE + QUOTE ============ -->
    <div class="auth-visual">
      <div class="auth-visual__overlay">
        <h3>PEOPLE<br>CAMPAIGNS<br>IMPACT<br>TOGETHER</h3>
      </div>
    </div>

  </div>

  <script src="js/admin-auth.js"></script>
</body>
</html>
