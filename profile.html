<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arika Collabs | My Profile</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/dashboard.css">
</head>

<body class="dashboard-page">

  <div class="dashboard-shell">

    <aside class="sidebar">
      <a href="index.html" class="logo">ARIKA <span>COLLABS</span></a>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link" data-page="dashboard"><span class="icon">&#9638;</span> Dashboard</a>
        <a href="collaborations.html" class="sidebar-link" data-page="collaborations"><span class="icon">&#128279;</span> Collaborations</a>
        <a href="profile.html" class="sidebar-link active" data-page="profile"><span class="icon">&#128100;</span> Profile</a>
        <a href="contact.html" class="sidebar-link" data-page="contact"><span class="icon">&#9993;</span> Contact Arika</a>
      </nav>
      <a href="login.html" class="sidebar-link sidebar-logout"><span class="icon">&#8630;</span> Logout</a>
    </aside>

    <div class="dashboard-main">
      <header class="dashboard-topbar">
        <a href="index.html" class="btn btn-outline btn-sm">&#127760; Visit Website</a>
        <div class="topbar-right">
          <button class="icon-btn" aria-label="Notifications">&#128276;</button>
          <div class="user-chip">
            <img src="assets/images/avatar-priya.svg" alt="Priya">
            <div class="user-meta">Hi, Priya <small>&#9662;</small></div>
          </div>
        </div>
      </header>

      <div class="dashboard-greeting">
        <h1>My Profile</h1>
        <p>Keep your details up to date so brands can find and reach you easily.</p>
      </div>

      <div class="card">
        <form class="two-col-form">
          <div>
            <label for="p-name">Full Name</label>
            <input type="text" id="p-name" value="Priya Sharma">
          </div>
          <div>
            <label for="p-insta">Instagram Username</label>
            <input type="text" id="p-insta" value="@priyasharma">
          </div>
          <div>
            <label for="p-email">Email Address</label>
            <input type="email" id="p-email" value="priya@example.com">
          </div>
          <div>
            <label for="p-phone">Phone Number</label>
            <input type="tel" id="p-phone" value="+91 98765 43210">
          </div>
          <div>
            <label for="p-category">Category / Niche</label>
            <select id="p-category">
              <option selected>Fashion</option>
              <option>Beauty</option>
              <option>Lifestyle</option>
              <option>Tech</option>
              <option>Fragrance</option>
              <option>Skincare</option>
            </select>
          </div>
          <div>
            <label for="p-location">Location (City)</label>
            <input type="text" id="p-location" value="Mumbai, India">
          </div>
          <div class="span-2">
            <label for="p-bio">Bio</label>
            <textarea id="p-bio" rows="4">Fashion & lifestyle creator sharing everyday style inspiration and honest product reviews.</textarea>
          </div>
          <div class="span-2">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
  <script src="js/contact.js"></script> <!-- reuses two-col-form submit placeholder handler -->
</body>
</html>
