<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arika Collabs | Forgot Password</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="auth-page">
  <div class="auth-split">

    <div class="auth-panel">
      <a href="index.html" class="logo">ARIKA <span>COLLABS</span></a>

      <div class="auth-card">
        <form class="auth-form active" id="forgot-form">
          <h2>Reset your password</h2>
          <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

          <label for="fp-email">Email address</label>
          <input type="email" id="fp-email" placeholder="you@example.com" required>

          <button type="submit" class="btn btn-gold btn-full">Send Reset Link &rarr;</button>

          <p class="auth-switch">
            Remembered your password? <a href="login.html">Back to Login</a>
          </p>
        </form>
      </div>
    </div>

    <div class="auth-visual">
      <div class="auth-visual__overlay">
        <h3>CREATE<br>COLLABORATE<br>GROW</h3>
        <p>A brighter tomorrow together.</p>
      </div>
    </div>

  </div>

  <script src="js/forgot-password.js"></script>
</body>
</html>
